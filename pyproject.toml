[project]
name = "retail-promotions-analytics"
version = "0.1.0"
description = "Retail promotions analytics on Databricks using dunnhumby's The Complete Journey"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Versions mirror Databricks serverless environment version 6 (Python 3.12.3, Spark 4.2.0 / DBR 19).
    "pyspark==4.2.0",
    "pandas==2.3.3",
    "numpy==2.3.4",
    "pyarrow==21.0.0",
    "pyfixest>=0.60",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_promo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Globals that Databricks notebooks provide.
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint.per-file-ignores]
# Notebooks put src/ on sys.path before importing the package.
"notebooks/*.py" = ["E402"]
